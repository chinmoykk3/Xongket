[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xongket-ai"
version = "0.1.0"
description = "Forecasting & anomaly-detection package for Xongket"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
