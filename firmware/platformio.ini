; PlatformIO configuration for sensor nodes
; Target hardware: NodeMCU ESP8266 (ESP-12E) with ESP32 available for future expansion

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
