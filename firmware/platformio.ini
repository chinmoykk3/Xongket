; PlatformIO Project Configuration for Xongket NodeMCU ESP8266 Sensor Fleet
; Target MCU: ESP8266 (NodeMCU 1.0 / ESP-12E)
; Framework: Arduino

[platformio]
default_envs = node1_water, node2_soil, node3_alert

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -Ilib
    -Ilib/common
    -Ilib/sensors
    -Ilib/alerts
lib_extra_dirs = lib
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ── Node 1: Water Level Ultrasonic & Ambient Weather Station ───────────────────
[env:node1_water]
build_src_filter = -<*> +<node1_water/*>

; ── Node 2: Capacitive Soil Moisture & Landslide Station ───────────────────────
[env:node2_soil]
build_src_filter = -<*> +<node2_soil/*>

; ── Node 3: Community Village Alert Unit & Audio Siren ─────────────────────────
[env:node3_alert]
build_src_filter = -<*> +<node3_alert/*>
